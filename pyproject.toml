[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-fuse"
version = "0.1.0"
description = "A small single-GPU fusion compiler for functional PyTorch inference subgraphs"
requires-python = ">=3.11"
dependencies = ["torch>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]
qwen = ["transformers==4.51.3"]

[tool.setuptools]
packages = ["sparkfuse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
sparkfuse = ["csrc/*.cpp"]
