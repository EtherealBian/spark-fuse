name: Replay published evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Rebuild recorded results (CPU only)
        run: bash audit/replay-key-results.sh
      - name: Test prefix-cut and archive checks
        env:
          PYTHONPATH: audit:benchmarks/pretrained_qwen:benchmarks/quant_serving
        run: |
          python3 -B -m unittest discover -s benchmarks/pretrained_qwen/prefix_cuts32 -p test_boundary.py
          python3 -B -m unittest discover -s audit -p test_prefix32_archive.py
